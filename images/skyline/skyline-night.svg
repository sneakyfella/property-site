<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Night sky gradient -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#020408"/>
      <stop offset="45%"  stop-color="#080e1c"/>
      <stop offset="80%"  stop-color="#0d1a2e"/>
      <stop offset="100%" stop-color="#142038"/>
    </linearGradient>
    <!-- City glow on horizon -->
    <radialGradient id="glow1" cx="50%" cy="100%" r="55%">
      <stop offset="0%"   stop-color="#c9a259" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#c9a259" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="72%" cy="100%" r="35%">
      <stop offset="0%"   stop-color="#e8c97a" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#e8c97a" stop-opacity="0"/>
    </radialGradient>
    <!-- Water gradient -->
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0e1f38" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#020408"/>
    </linearGradient>
    <!-- Water shimmer -->
    <linearGradient id="shimmer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#c9a259" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#c9a259" stop-opacity="0.06"/>
      <stop offset="50%"  stop-color="#c9a259" stop-opacity="0.14"/>
      <stop offset="70%"  stop-color="#c9a259" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#c9a259" stop-opacity="0"/>
    </linearGradient>
    <!-- Building silhouette color -->
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1a2640"/>
      <stop offset="100%" stop-color="#0d1728"/>
    </linearGradient>
    <linearGradient id="bldg2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#141e30"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </linearGradient>
    <!-- MBS sky park gradient -->
    <linearGradient id="mbs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#1f2e48"/>
      <stop offset="100%" stop-color="#0d1728"/>
    </linearGradient>
    <!-- Reflection -->
    <linearGradient id="refl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0d1728" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0d1728" stop-opacity="0"/>
    </linearGradient>
    <!-- Moon glow -->
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#f5e9c8" stop-opacity="0.9"/>
      <stop offset="40%"  stop-color="#e8d4a0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#c9a259" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
    <filter id="blur4">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blur6">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blur1">
      <feGaussianBlur stdDeviation="1"/>
    </filter>
  </defs>

